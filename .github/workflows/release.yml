# Raman Fox: the Android app (one APK for every phone and Android TV), built from this repo.
# - Run it by hand (Actions → Release → Run workflow): the APK is an artifact of the run.
# - Or push a version tag (git tag v1.0.0 && git push origin v1.0.0): the APK also goes into a draft release, named
#   raman-fox-<version>.apk, which is the name the app's updater looks for (gui/updater.js).
# Signing: the secrets RAMANFOX_KEYSTORE_BASE64, RAMANFOX_KEYSTORE_PASSWORD and RAMANFOX_KEY_ALIAS if they are set,
# else the debug key (such an APK can't update one signed with the release key: uninstall first).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RAMANFOX_KEYSTORE_BASE64 }}
          RAMANFOX_KEYSTORE_PASSWORD: ${{ secrets.RAMANFOX_KEYSTORE_PASSWORD }}
          RAMANFOX_KEY_ALIAS: ${{ secrets.RAMANFOX_KEY_ALIAS }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            npm pkg set version="$v" # the APK's versionName and versionCode come from it
          else
            v="$(node -p "require('./package.json').version")"
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RAMANFOX_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          cd mobile
          npm ci
          npm run build # arm64-v8a, armeabi-v7a and x86_64 (android/gradle.properties), and the universal APK
          mv android/app/build/outputs/apk/release/app-universal-release.apk "$GITHUB_WORKSPACE/raman-fox-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: raman-fox-android
          path: raman-fox-*.apk
          if-no-files-found: error

  release:
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft the release, or add to it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --draft --title "Raman Fox ${GITHUB_REF_NAME#v}" --generate-notes
          fi
